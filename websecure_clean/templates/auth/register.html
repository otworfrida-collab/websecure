<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — WebSecure</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --bg:#0a0f1e;--card:#111827;--border:#1e2d45;--accent:#3b82f6;--text:#e2e8f0;--muted:#64748b;--font-mono:'Space Mono',monospace;--font-sans:'DM Sans',sans-serif; }
    *{box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,0.08) 0%,transparent 60%);}
    .auth-wrap{width:100%;max-width:440px;padding:24px;}
    .auth-logo{text-align:center;margin-bottom:28px;}
    .logo-icon{width:52px;height:52px;background:var(--accent);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;color:white;margin-bottom:10px;}
    .logo-name{font-family:var(--font-mono);font-size:18px;font-weight:700;}
    .logo-name span{color:var(--accent);}
    .logo-sub{font-size:12px;color:var(--muted);}
    .auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 32px;}
    .auth-title{font-size:18px;font-weight:700;margin-bottom:4px;}
    .auth-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
    .form-group{margin-bottom:16px;}
    .form-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:6px;}
    .form-input{width:100%;background:#0d1526;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;font-family:var(--font-sans);transition:border-color 0.15s;outline:none;}
    .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,0.12);}
    .input-icon-wrap{position:relative;}
    .input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;}
    .input-icon-wrap .form-input{padding-left:36px;}
    .btn-primary{width:100%;background:var(--accent);color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:all 0.15s;margin-top:4px;}
    .btn-primary:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,0.35);}
    .auth-footer{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
    .auth-footer a{color:var(--accent);text-decoration:none;font-weight:500;}
    .flash-item{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:8px 12px;font-size:12px;color:#fca5a5;margin-bottom:6px;}
    .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo-icon"><i class="bi bi-shield-check"></i></div>
    <div class="logo-name">Security<span>Web</span></div>
    <div class="logo-sub">Create your free account</div>
  </div>
  <div class="auth-card">
    <h1 class="auth-title">Get started</h1>
    <p class="auth-sub">Monitor your website security for free</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash-item">{{ msg }}</div>{% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-icon-wrap">
          <i class="bi bi-person input-icon"></i>
          <input type="text" name="username" class="form-input" placeholder="yourusername"
                 value="{{ username or '' }}" required minlength="3">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="email" class="form-input" placeholder="you@example.com"
                 value="{{ email or '' }}" required>
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="Min 8 chars" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm</label>
          <input type="password" name="confirm_password" class="form-input" placeholder="Repeat" required>
        </div>
      </div>
      <button type="submit" class="btn-primary">Create Account <i class="bi bi-arrow-right"></i></button>
    </form>
    <div class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
  </div>
</div>
</body>
</html>
