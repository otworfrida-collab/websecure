<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — WebSecure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e; --card: #111827; --border: #1e2d45;
      --accent: #3b82f6; --text: #e2e8f0; --muted: #64748b;
      --font-mono: 'Space Mono', monospace; --font-sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-sans);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 60%);
    }
    .auth-wrap { width: 100%; max-width: 420px; padding: 24px; }
    .auth-logo {
      text-align: center; margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px; background: var(--accent); border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 26px; color: white; margin-bottom: 12px;
    }
    .logo-name {
      font-family: var(--font-mono); font-size: 20px; font-weight: 700;
      color: var(--text);
    }
    .logo-name span { color: var(--accent); }
    .logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px;
    }
    .auth-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; display: block; margin-bottom: 8px; }
    .form-input {
      width: 100%; background: #0d1526; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 11px 14px; font-size: 14px;
      font-family: var(--font-sans); transition: border-color 0.15s; outline: none;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .input-icon-wrap { position: relative; }
    .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
    .input-icon-wrap .form-input { padding-left: 38px; }

    .btn-primary {
      width: 100%; background: var(--accent); color: white; border: none;
      border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: var(--font-sans); transition: all 0.15s;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }

    .flash-list { margin-bottom: 16px; }
    .flash-item {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #fca5a5;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
    }
    .flash-item.success { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.25); color: #86efac; }
    .flash-item.info    { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.25); color: #93c5fd; }

    .remember-row { display: flex; align-items: center; gap: 8px; }
    .remember-row input { accent-color: var(--accent); width: 15px; height: 15px; }
    .remember-row label { font-size: 13px; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo-icon"><i class="bi bi-shield-check"></i></div>
    <div class="logo-name">Security<span>Web</span></div>
    <div class="logo-sub">Vulnerability Scanner & Monitor</div>
  </div>

  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your security dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-list">
        {% for cat, msg in messages %}
        <div class="flash-item {{ cat }}">
          <i class="bi bi-exclamation-circle"></i> {{ msg }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>
      </div>
      <div class="form-group">
        <div class="remember-row">
          <input type="checkbox" name="remember" id="remember">
          <label for="remember">Keep me signed in</label>
        </div>
      </div>
      <button type="submit" class="btn-primary">Sign In <i class="bi bi-arrow-right"></i></button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a>
    </div>
  </div>
</div>
</body>
</html>
